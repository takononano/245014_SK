:root{--bg:#02030a;--fg:#e8ecff;--accent:#ffd98a;--panel:rgba(10,14,34,.94)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:"Hiragino Mincho ProN","Yu Mincho",serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}

header{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 18px) 24px 0;pointer-events:none;text-shadow:0 0 12px #000}

.legend i{color:var(--accent);font-style:normal}.legend b{color:#9fb4ff;font-weight:400}
@keyframes p{50%{opacity:.25}}
#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,8,.6);padding:16px;z-index:5}
#modal.on{display:flex;animation:f .4s}
@keyframes f{from{opacity:0}}
.card{position:relative;max-width:560px;width:100%;max-height:88%;overflow:auto;background:var(--panel);border:1px solid rgba(255,217,138,.4);border-radius:14px;padding:28px 28px 24px;box-shadow:0 0 60px rgba(120,140,255,.25);line-height:1.9}
.card h2{margin:0 0 4px;font-weight:400;font-size:26px;letter-spacing:.2em;color:var(--accent)}
.meta{font-size:12px;letter-spacing:.08em;opacity:.7;margin-bottom:14px}
.card svg{display:block;margin:0 auto 14px;max-width:240px;width:100%}
.card h3{font-size:15px;margin:16px 0 4px;color:#9fb4ff;font-weight:400;letter-spacing:.1em}
.card p{margin:0;font-size:15px}
.x{position:absolute;top:10px;right:14px;background:none;border:0;color:var(--fg);font-size:28px;cursor:pointer}
</style>

const D=Math.PI/180,TAU=Math.PI*2;

C.forEach(c=>{c.p=c.st.map(([h,d,m])=>[h*15*D,d*D,m]);let X=0,Y=0,Zv=0;c.p.forEach(([a,d])=>{X+=Math.cos(d)*Math.cos(a);Y+=Math.cos(d)*Math.sin(a);Zv+=Math.sin(d)});c.ra=Math.atan2(Y,X);c.dec=Math.atan2(Zv,Math.hypot(X,Y))});
const R=(a,b)=>a+Math.random()*(b-a);

const bg=[];for(let i=0;i<1600;i++){const q=Math.random();bg.push({a:R(0,TAU),d:Math.asin(R(-1,1)),r:.4+q*q*q*1.6,t:R(0,6.28),sp:R(.5,2.5),h:Math.random()<.2?R(190,240):R(30,60)})}
// milky way (galactic plane -> equatorial)
const mw=[];{const aG=192.859*D,dG=27.128*D,t0=122.932*D;for(let i=0;i<2400;i++){const l=R(0,TAU),b=(Math.random()+Math.random()+Math.random()-1.5)*.16*(1+.8*Math.cos(l-0));
 const sd=Math.sin(dG)*Math.sin(b)+Math.cos(dG)*Math.cos(b)*Math.cos(t0-l);
 const a=aG+Math.atan2(Math.cos(b)*Math.sin(t0-l),Math.cos(dG)*Math.sin(b)-Math.sin(dG)*Math.cos(b)*Math.cos(t0-l));mw.push([a,Math.asin(sd)])}}

const ecl=[];for(let i=0;i<=180;i++){const L=i*2*D,e=23.44*D;ecl.push([Math.atan2(Math.cos(e)*Math.sin(L),Math.cos(L)),Math.asin(Math.sin(e)*Math.sin(L))])}
const cv=document.getElementById('c'),g=cv.getContext('2d');
let vw,vh,dpr;
function rs(){dpr=Math.min(devicePixelRatio||1,2);vw=innerWidth;vh=innerHeight;cv.width=vw*dpr;cv.height=vh*dpr;g.setTransform(dpr,0,0,dpr,0,0)}

// view: stereographic projection centred on (a0,d0), east on the left like the real sky
let a0=5.2*15*D,d0=8*D,zoom=1,vA=.0006,vD=0,drag=false,lx,ly,moved=0,hov=-1,time=0,shoot=[];
const SC=()=>Math.max(vw,vh)*.55*zoom;
function proj(a,d,A0,D0,s,ox,oy){const da=a-A0,cd=Math.cos(d),sd=Math.sin(d),c0=Math.cos(D0),s0=Math.sin(D0);
 const cc=s0*sd+c0*cd*Math.cos(da);if(cc<-.8)return null;const k=2/(1+cc);
 return[ox-k*cd*Math.sin(da)*s,oy-k*(c0*sd-s0*cd*Math.cos(da))*s]}
const P=(a,d)=>proj(a,d,a0,d0,SC(),vw/2,vh/2);
function sdist(px,py,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],L=dx*dx+dy*dy;let t=L?((px-a[0])*dx+(py-a[1])*dy)/L:0;t=Math.max(0,Math.min(1,t));return Math.hypot(px-a[0]-t*dx,py-a[1]-t*dy)}
function hit(mx,my){let best=-1,bd=20;C.forEach((c,i)=>{const q=c.sp;if(!q)return;let m=1e9;c.l.forEach(([i1,i2])=>{if(q[i1]&&q[i2])m=Math.min(m,sdist(mx,my,q[i1],q[i2]))});q.forEach(p=>{if(p)m=Math.min(m,Math.hypot(mx-p[0],my-p[1]))});if(m<bd){bd=m;best=i}});return best}
cv.addEventListener('pointerdown',e=>{drag=true;moved=0;lx=e.clientX;ly=e.clientY;cv.classList.add('drag');cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{
 if(drag){const dx=e.clientX-lx,dy=e.clientY-ly;moved+=Math.abs(dx)+Math.abs(dy);const s=SC(),ca=Math.max(.3,Math.cos(d0));
  a0+=dx/(s*ca);d0+=dy/s;vA=dx/(s*ca)*.8;vD=dy/s*.8;lx=e.clientX;ly=e.clientY;clampD()}
 hov=hit(e.clientX,e.clientY);cv.classList.toggle('hover',hov>=0&&!drag)});
cv.addEventListener('pointerup',e=>{drag=false;cv.classList.remove('drag');if(moved<6){const i=hit(e.clientX,e.clientY);if(i>=0)open(i)}});
cv.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.6,Math.min(3,zoom*(e.deltaY<0?1.1:.9)))},{passive:false});
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')vA=.01;if(e.key==='ArrowRight')vA=-.01;if(e.key==='ArrowUp')vD=-.008;if(e.key==='ArrowDown')vD=.008;if(e.key==='Escape')closeM()});
function clampD(){d0=Math.max(-70*D,Math.min(88*D,d0))}
function open(i){const c=C[i];
 // local chart centred on the constellation
 const pts=c.p.map(([a,d])=>proj(a,d,c.ra,c.dec,1,0,0));let m=0;pts.forEach(p=>m=Math.max(m,Math.abs(p[0]),Math.abs(p[1])));const k=105/m;
 let s='<svg viewBox="-130 -130 260 260">';
 c.l.forEach(([a,b])=>s+=`<line x1="${pts[a][0]*k}" y1="${pts[a][1]*k}" x2="${pts[b][0]*k}" y2="${pts[b][1]*k}" stroke="#9fb4ff" stroke-width="1.5" opacity=".7"/>`);
 c.p.forEach((q,j)=>{const r=Math.max(2,5.2-q[2]*.9);s+=`<circle cx="${pts[j][0]*k}" cy="${pts[j][1]*k}" r="${r*2.6}" fill="#ffd98a" opacity=".18"/><circle cx="${pts[j][0]*k}" cy="${pts[j][1]*k}" r="${r}" fill="#fff"/>`});
 s+='</svg>';
 card.innerHTML=`<button class="x" onclick="closeM()" aria-label="閉じる">×</button>${s}<h2>${c.sym} ${c.n}</h2><div class="meta">${c.en} ／ ${c.z?'黄道十二星座':'星座'} ／ 見ごろ:${c.s} ／ 主な星:${c.b}</div><h3>神話・エピソード</h3><p>${c.t}</p>`;
 modal.classList.add('on')}
function closeM(){modal.classList.remove('on')}
modal.addEventListener('click',e=>{if(e.target===modal)closeM()});
function frame(t){
 time=t/1000;
 if(!drag){a0+=vA;d0+=vD;vA+=(.0006-vA)*.03;vD*=.92;clampD()}
 a0=((a0%TAU)+TAU)%TAU;
 const gr=g.createLinearGradient(0,0,0,vh);gr.addColorStop(0,'#01020a');gr.addColorStop(.6,'#0a0f2a');gr.addColorStop(1,'#1b1440');
 g.fillStyle=gr;g.fillRect(0,0,vw,vh);
 // milky way
 g.fillStyle='rgba(175,185,255,.035)';
 for(const[a,d]of mw){const p=P(a,d);if(!p||p[0]<-20||p[0]>vw+20||p[1]<-20||p[1]>vh+20)continue;g.beginPath();g.arc(p[0],p[1],7,0,TAU);g.fill()}
 // ecliptic
 g.strokeStyle='rgba(255,217,138,.3)';g.lineWidth=1;g.setLineDash([3,7]);g.beginPath();let prev=null;
 for(const[a,d]of ecl){const p=P(a,d);if(p&&prev&&Math.hypot(p[0]-prev[0],p[1]-prev[1])<vw)g.lineTo(p[0],p[1]);else if(p)g.moveTo(p[0],p[1]);prev=p}
 g.stroke();g.setLineDash([]);
 // background stars
 for(const s of bg){const p=P(s.a,s.d);if(!p||p[0]<-5||p[0]>vw+5||p[1]<-5||p[1]>vh+5)continue;
  g.globalAlpha=.4+.6*(.5+.5*Math.sin(time*s.sp+s.t));g.fillStyle=`hsl(${s.h},70%,85%)`;g.beginPath();g.arc(p[0],p[1],s.r,0,TAU);g.fill()}
 g.globalAlpha=1;
 // shooting stars
 if(Math.random()<.004)shoot.push({x:R(0,vw),y:R(0,vh*.4),l:0});
 shoot=shoot.filter(s=>s.l<1);
 for(const s of shoot){s.l+=.025;const x=s.x+s.l*260,y=s.y+s.l*130;const gg=g.createLinearGradient(x,y,x-90,y-45);gg.addColorStop(0,`rgba(255,255,255,${1-s.l})`);gg.addColorStop(1,'rgba(255,255,255,0)');g.strokeStyle=gg;g.lineWidth=2;g.beginPath();g.moveTo(x,y);g.lineTo(x-90,y-45);g.stroke()}
 // constellations
 C.forEach((c,i)=>{c.sp=c.p.map(([a,d])=>P(a,d));const q=c.sp;if(!q.some(p=>p&&p[0]>-200&&p[0]<vw+200&&p[1]>-200&&p[1]<vh+200)){c.sp=null;return}
  const h=i===hov,col=c.z?'255,217,138':'150,180,255';
  g.strokeStyle=`rgba(${col},${h?1:.5})`;g.lineWidth=h?2.2:1.2;g.beginPath();
  c.l.forEach(([a,b])=>{if(q[a]&&q[b]&&Math.hypot(q[a][0]-q[b][0],q[a][1]-q[b][1])<vw){g.moveTo(q[a][0],q[a][1]);g.lineTo(q[b][0],q[b][1])}});g.stroke();
  c.p.forEach((st,j)=>{const p=q[j];if(!p)return;const r=Math.max(1.6,4.4-st[2]*.75)*Math.sqrt(zoom);
   g.fillStyle=`rgba(${col},${h?.4:.22})`;g.beginPath();g.arc(p[0],p[1],r*3,0,TAU);g.fill();
   g.fillStyle='#fff';g.beginPath();g.arc(p[0],p[1],r,0,TAU);g.fill()});
  const lp=P(c.ra,c.dec);if(lp){g.font=`${h?17:14}px "Hiragino Mincho ProN","Yu Mincho",serif`;g.textAlign='center';g.fillStyle=h?'#ffd98a':`rgba(${c.z?'255,225,160':'200,215,255'},.8)`;g.fillText((c.sym?c.sym+' ':'')+c.n,lp[0],lp[1]+ (Math.max(...q.filter(Boolean).map(p=>Math.abs(p[1]-lp[1])))+22))}});
 requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script>
